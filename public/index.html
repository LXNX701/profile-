<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOONX7 Profile</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#06070b;color:#f5f7ff;font:15px Inter,system-ui,sans-serif;min-height:100vh;background-image:radial-gradient(circle at 20% 0%,#16233d 0,transparent 32%),radial-gradient(circle at 90% 20%,#24102e 0,transparent 30%)}.wrap{max-width:1180px;margin:auto;padding:28px 18px 60px}.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.logo{font-size:24px;font-weight:900;letter-spacing:1px}.logo span{color:#8d7aff}.pill{border:1px solid #2d3446;border-radius:999px;padding:8px 12px;color:#aeb7c9}.hero,.card{background:linear-gradient(145deg,rgba(22,25,35,.86),rgba(10,12,18,.78));border:1px solid #252c3b;box-shadow:0 20px 70px #0007;backdrop-filter:blur(18px);border-radius:24px}.hero{padding:34px;text-align:center}.hero h1{font-size:46px;margin:0 0 10px}.hero p{color:#8f9bb1}.search{display:flex;gap:10px;max-width:720px;margin:24px auto 0}.search input,.search select,.search button{border:1px solid #30384a;background:#0d111a;color:white;border-radius:14px;padding:15px}.search input{flex:1}.search button{background:linear-gradient(135deg,#7b61ff,#b14dff);font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin-top:18px}.card{padding:24px}.profile{display:flex;gap:20px;align-items:center}.avatar{width:100px;height:100px;border-radius:24px;background:linear-gradient(135deg,#2b3150,#151822);display:grid;place-items:center;font-size:38px;border:1px solid #3b4560}.nick{font-size:30px;font-weight:900}.muted{color:#8995aa}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}.stat{background:#0b0e15;border:1px solid #202738;border-radius:16px;padding:15px}.stat b{display:block;font-size:20px}.sectionTitle{font-weight:800;font-size:18px;margin-bottom:16px}.rank{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #202532}.items{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.item{height:105px;border-radius:16px;background:linear-gradient(145deg,#171c2a,#0b0e14);border:1px solid #242c3d;display:grid;place-items:center;color:#707c91}.json{white-space:pre-wrap;overflow:auto;max-height:360px;font-size:12px;color:#aab4c7}.hidden{display:none}.error{color:#ff6d8a;margin-top:15px}@media(max-width:760px){.grid{grid-template-columns:1fr}.hero h1{font-size:34px}.search{flex-direction:column}.items{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><div class="wrap"><div class="nav"><div class="logo">MOON<span>X7</span> PROFILE</div><div class="pill">Free Fire Intelligence</div></div>
<section class="hero"><h1>Player Profile</h1><p>Busca cualquier UID y explora su perfil, rangos, estadísticas y gremio.</p>
<div class="search"><input id="uid" inputmode="numeric" placeholder="Introduce UID, ejemplo 485530862"><select id="region"></select><button onclick="loadProfile()">SEARCH</button></div><div id="error" class="error"></div></section>
<div id="result" class="hidden"><div class="grid"><section class="card"><div class="profile"><div class="avatar" id="avatar">★</div><div><div class="nick" id="nick">—</div><div class="muted" id="meta">—</div></div></div><div class="stats"><div class="stat"><span class="muted">Level</span><b id="level">—</b></div><div class="stat"><span class="muted">Likes</span><b id="likes">—</b></div><div class="stat"><span class="muted">Region</span><b id="reg">—</b></div></div></section>
<section class="card"><div class="sectionTitle">Rank</div><div class="rank"><span>Battle Royale</span><b id="br">—</b></div><div class="rank"><span>Clash Squad</span><b id="cs">—</b></div></section></div>
<section class="card" style="margin-top:18px"><div class="sectionTitle">Profile details</div><div id="details" class="muted"></div></section>
<section class="card" style="margin-top:18px"><div class="sectionTitle">Player data</div><div id="json" class="json"></div></section></div>
</div>
<script>
async function init(){const r=await fetch("/api/regions");const d=await r.json();region.innerHTML=d.regions.map(x=>'<option value="'+x.code+'">'+x.flag+' '+x.code+' — '+x.name+'</option>').join("");}
function pick(o,...keys){for(const k of keys){if(o&&o[k]!==undefined&&o[k]!==null)return o[k]}return "—"}
async function loadProfile(){error.textContent="";result.classList.add("hidden");const u=uid.value.trim();const rg=region.value;if(!u)return error.textContent="Escribe un UID.";try{const r=await fetch("/api/profile?uid="+encodeURIComponent(u)+"&region="+rg);const d=await r.json();if(!r.ok)throw new Error(d.error||"No se pudo consultar");const b=d.account?.basicInfo||d.account?.result?.basicInfo||{};nick.textContent=pick(b,"nickname");meta.textContent="UID "+u+" · "+rg;level.textContent=pick(b,"level");likes.textContent=Number(pick(b,"liked")).toLocaleString();reg.textContent=rg;br.textContent=pick(b,"brRank","rank","rankingPoints");cs.textContent=pick(b,"csRank","csRankingPoints");details.textContent="EXP: "+pick(b,"exp")+" · Prime: "+pick(b,"primeLevel")+" · Banner: "+pick(b,"bannerId")+" · Head: "+pick(b,"headPic");json.textContent=JSON.stringify(d,null,2);result.classList.remove("hidden");}catch(e){error.textContent=e.message}}
init();
</script></body></html>
